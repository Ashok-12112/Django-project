<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>  
</head>
<body class="bg-gray-100 p-8">
    <div class="flex flex-wrap gap-6">
        {% for item in data %}
        <div class="bg-white rounded-xl shadow-md p-4 w-64 text-center">
            <img src="{{ item.image.url }}" alt="{{ item.name }}" class="w-full h-48 object-cover rounded-lg mb-3">
            <h1 class="text-xl font-bold text-gray-800">{{ item.name }}</h1>
           <a href="{% url 'userdata' item.id %}">
    <button class="mt-3 w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
        View Details
    </button>
</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
